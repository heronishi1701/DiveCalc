name: Generate Sitemap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: sitemap.xml を生成
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          echo '<url><loc>https://heronishi1701.github.io/DiveCalc/</loc></url>' >> sitemap.xml

          for file in *.html
          do
            echo "<url><loc>https://heronishi1701.github.io/DiveCalc/$file</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      - name: sitemap.xml をコミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sitemap.xml"