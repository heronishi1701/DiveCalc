name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Generate sitemap.xml
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://heronishi1701.github.io/DiveCalc"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          is_disallowed() {
            local p="$1"
            [[ -f robots.txt ]] || return 1
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs)"
              [[ "$line" =~ ^Disallow:[[:space:]]*(.+)$ ]] || continue
              rule="${BASH_REMATCH[1]}"
              [[ "$rule" == "/" ]] && return 0
              rule="${rule#/}"
              [[ -z "$rule" ]] && continue
              [[ "$p" == "$rule"* ]] && return 0
            done < robots.txt
            return 1
          }

          {
            echo "./index.html"

            find . -type f -name "*.html" \
              ! -name "index.html" \
              ! -path "./.git/*" |
            sort
          } | while read -r file
          do
            path="${file#./}"
            name="$(basename "$path")"

            case "$name" in
              404.html|google*.html)
                continue
                ;;
            esac

            if is_disallowed "$path"; then
              continue
            fi

            if [[ "$path" == "index.html" ]]; then
              url="$BASE_URL/"
              priority="1.0"
              changefreq="weekly"
            elif [[ "$name" == "index.html" ]]; then
              dir="$(dirname "$path")"
              url="$BASE_URL/$dir/"
              priority="0.8"
              changefreq="monthly"
            else
              url="$BASE_URL/$path"
              changefreq="monthly"
              case "$name" in
                calculator.html|nitrox.html|mod.html)
                  priority="0.9"
                  ;;
                *)
                  priority="0.8"
                  ;;
              esac
            fi

            lastmod=$(git log -1 --format=%cI -- "$path" 2>/dev/null || true)
            [[ -z "$lastmod" ]] && lastmod=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            printf '  <url>\n' >> sitemap.xml
            printf '    <loc>%s</loc>\n' "$url" >> sitemap.xml
            printf '    <lastmod>%s</lastmod>\n' "$lastmod" >> sitemap.xml
            printf '    <changefreq>%s</changefreq>\n' "$changefreq" >> sitemap.xml
            printf '    <priority>%s</priority>\n' "$priority" >> sitemap.xml
            printf '  </url>\n' >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml
          xmllint --format sitemap.xml --output sitemap.xml

      - name: Commit sitemap.xml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update sitemap.xml"
          file_pattern: sitemap.xml
