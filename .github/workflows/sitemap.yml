name: Generate Sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Generate sitemap.xml
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://heronishi1701.github.io/DiveCalc"

          escape_xml() {
            sed -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g' \
                -e "s/'/\&apos;/g" \
                -e 's/"/\&quot;/g'
          }

          is_disallowed() {
            local p="$1"
            if [[ -f robots.txt ]]; then
              while IFS= read -r line; do
                line="${line%%#*}"
                line="$(echo "$line" | xargs)"
                [[ -z "$line" ]] && continue
                if [[ "$line" =~ ^Disallow:[[:space:]]*(.+)$ ]]; then
                  rule="${BASH_REMATCH[1]}"
                  [[ "$rule" == "/" ]] && return 0
                  rule="${rule#/}"
                  [[ -z "$rule" ]] && continue
                  if [[ "$p" == "$rule"* ]]; then
                    return 0
                  fi
                fi
              done < robots.txt
            fi
            return 1
          }

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'

            while IFS= read -r file; do
              path="${file#./}"
              name="$(basename "$path")"

              case "$name" in
                404.html|google*.html|google-site-verification*.html)
                  continue;;
              esac

              if is_disallowed "$path"; then
                continue
              fi

              if [[ "$path" == "index.html" ]]; then
                url="${BASE_URL}/"
                priority="1.0"
                changefreq="weekly"
              elif [[ "$name" == "index.html" ]]; then
                dir="$(dirname "$path")"
                url="${BASE_URL}/${dir}/"
                priority="0.8"
                changefreq="monthly"
              else
                url="${BASE_URL}/${path}"
                case "$name" in
                  calculator.html|nitrox.html|mod.html)
                    priority="0.9";;
                  *)
                    priority="0.8";;
                esac
                changefreq="monthly"
              fi

              lastmod="$(git log -1 --format=%cI -- "$path" || true)"
              [[ -z "$lastmod" ]] && lastmod="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

              loc="$(printf '%s' "$url" | escape_xml)"

              cat <<EOF
  <url>
    <loc>${loc}</loc>
    <lastmod>${lastmod}</lastmod>
    <changefreq>${changefreq}</changefreq>
    <priority>${priority}</priority>
  </url>
EOF
            done < <(find . -type f -name "*.html" ! -path "./.git/*" | sort)

            echo '</urlset>'
          } > sitemap.xml

          xmllint --format sitemap.xml --output sitemap.xml

      - name: Commit sitemap.xml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sitemap.xml"
          file_pattern: sitemap.xml
